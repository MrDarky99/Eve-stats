<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eve Stats</title>
<style>
:root{--bg:#10141a;--card:#181e27;--line:#2a3340;--tx:#e8e4da;--mu:#8f98a6;--isk:#e0a43a;--up:#4fc3a1;--dn:#e8725c}
*{box-sizing:border-box}
body{margin:0 auto;max-width:880px;padding:14px;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1{font-size:22px;margin:0 0 2px;font-weight:700;letter-spacing:.2px}
h2{font-size:17px;margin:26px 0 8px;font-weight:650}
.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{background:var(--isk);color:#1a1405;border:0;border-radius:6px;padding:10px 14px;font:600 14px system-ui;cursor:pointer}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--isk);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.k{background:var(--card);border-left:3px solid var(--line);padding:10px 12px;border-radius:4px}
.k b{display:block;font-size:20px}
.up{color:var(--up)}.dn{color:var(--dn)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg)}
th{color:var(--mu);font-weight:600}
.tip{background:var(--card);border-left:3px solid var(--isk);padding:9px 12px;margin:7px 0;border-radius:4px}
.tip.bad{border-color:var(--dn)}.tip.good{border-color:var(--up)}
.set{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input{width:70px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:6px}
#msg{min-height:20px;margin:6px 0;color:var(--isk)}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<h1>Eve Stats</h1>
<div class="mu">Your trades, profit and market chances. Data stays in this browser.</div>
<div class="bar">
  <button id="bLogin">Log in with EVE</button>
  <button id="bSync" class="alt" hidden>Sync wallet</button>
  <button id="bScan" class="alt" hidden>Scan markets</button>
  <button id="bOut" class="alt" hidden>Log out</button>
</div>
<div id="msg"></div>
<div class="set mu" id="set" hidden>
  Sales tax % <input id="tax" type="number" step="0.01">
  Broker fee % <input id="brk" type="number" step="0.01">
</div>
<div id="app"></div>

<script>
const CID='157277a447ea4912ae61662d2872bc81';
const CB='https://mrdarky99.github.io/Eve-stats/';
const SCOPES='esi-wallet.read_character_wallet.v1 esi-markets.read_character_orders.v1';
const ESI='https://esi.evetech.net/latest';
const REGIONS=[['Jita',10000002],['Amarr',10000043],['Dodixie',10000032],['Rens',10000030],['Hek',10000042]];
const $=s=>document.querySelector(s);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pc=n=>(n*100).toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=t=>$('#msg').textContent=t||'';
const cls=n=>n>=0?'up':'dn';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const cfg=()=>{const c=LS('cfg')||{tax:4.5,brk:3};return{tax:c.tax/100,brk:c.brk/100,rt:c.tax,rb:c.brk}};

/* ---------- login ---------- */
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(32)));
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  const st=b64(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem('pk_v',v);localStorage.setItem('pk_s',st);
  location.href='https://login.eveonline.com/v2/oauth/authorize/?'+new URLSearchParams({response_type:'code',redirect_uri:CB,client_id:CID,scope:SCOPES,code_challenge:ch,code_challenge_method:'S256',state:st});
}
async function token(body){
  const r=await fetch('https://login.eveonline.com/v2/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...body})});
  if(!r.ok)throw new Error('Login failed: '+await r.text());
  const j=await r.json();
  const p=JSON.parse(atob(j.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  const a={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-30)*1000,id:+p.sub.split(':')[2],name:p.name};
  LS('auth',a);return a;
}
async function auth(){
  let a=LS('auth');if(!a)throw new Error('Not logged in');
  if(Date.now()>a.exp)a=await token({grant_type:'refresh_token',refresh_token:a.refresh});
  return a;
}
async function api(path,authed=true){
  const h={};if(authed)h.Authorization='Bearer '+(await auth()).access;
  const r=await fetch(ESI+path,{headers:h});
  if(!r.ok)throw new Error('ESI '+r.status+' on '+path.split('?')[0]);
  return r.json();
}

/* ---------- data ---------- */
async function names(ids){
  const n=LS('names')||{};
  const need=[...new Set(ids)].filter(i=>!n[i]&&(i<1e7||(i>=6e7&&i<6.4e7)));
  for(let i=0;i<need.length;i+=500){
    try{
      const r=await fetch(ESI+'/universe/names/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(need.slice(i,i+500))});
      if(r.ok)(await r.json()).forEach(x=>n[x.id]=x.name);
    }catch(e){}
  }
  LS('names',n);return n;
}
async function sync(){
  say('Syncing wallet…');
  const a=await auth();const all=LS('tx')||{};let from=null;
  for(let i=0;i<10;i++){
    const r=await api(`/characters/${a.id}/wallet/transactions/`+(from?`?from_id=${from}`:''));
    if(!r.length)break;
    r.forEach(t=>all[t.transaction_id]=t);
    const m=Math.min(...r.map(t=>t.transaction_id));
    if(r.length<2500||m===from)break;from=m;
  }
  LS('tx',all);
  const bal=await api(`/characters/${a.id}/wallet/`);
  const orders=await api(`/characters/${a.id}/orders/`);
  LS('acct',{bal,orders,at:Date.now()});
  await names([...Object.values(all).map(t=>t.type_id),...orders.map(o=>o.type_id)]);
  say('');render();
}

/* ---------- analysis ---------- */
function analyze(){
  const tx=Object.values(LS('tx')||{}).sort((a,b)=>a.transaction_id-b.transaction_id);
  const {tax,brk}=cfg();const items={};
  for(const t of tx){
    const it=items[t.type_id]??={id:t.type_id,lots:[],q:0,rev:0,cost:0,vol:0};
    it.vol+=t.quantity*t.unit_price;
    if(t.is_buy)it.lots.push({q:t.quantity,p:t.unit_price,d:t.date});
    else{let need=t.quantity;
      while(need>0&&it.lots.length){const l=it.lots[0],u=Math.min(need,l.q);
        it.q+=u;it.cost+=u*l.p;it.rev+=u*t.unit_price;l.q-=u;need-=u;if(!l.q)it.lots.shift();}}
  }
  const list=Object.values(items).map(it=>{
    it.profit=it.rev*(1-tax-brk)-it.cost*(1+brk);
    it.margin=it.cost?it.profit/it.cost:0;
    it.stock=it.lots.reduce((s,l)=>s+l.q*l.p,0);
    it.oldest=it.lots.length?it.lots[0].d:null;
    return it;
  });
  return {tx,list};
}

/* ---------- render ---------- */
function render(){
  const a=LS('auth');
  ['bSync','bScan','bOut'].forEach(i=>$('#'+i).hidden=!a);
  $('#bLogin').hidden=!!a;$('#set').hidden=!a;
  const c=cfg();$('#tax').value=c.rt;$('#brk').value=c.rb;
  if(!a){$('#app').innerHTML='<div class="tip">Log in with EVE to load your wallet transactions.</div>';return}
  const {tx,list}=analyze();const n=LS('names')||{};const ac=LS('acct');
  const nm=i=>esc(n[i]||'Item '+i);
  const traded=list.filter(i=>i.q>0).sort((x,y)=>y.profit-x.profit);
  const profit=traded.reduce((s,i)=>s+i.profit,0),cost=traded.reduce((s,i)=>s+i.cost,0);
  const stock=list.reduce((s,i)=>s+i.stock,0);
  let h=`<div class="grid">
   <div class="k"><span class="mu">Wallet</span><b>${ac?fmt(ac.bal):'–'}</b></div>
   <div class="k"><span class="mu">Profit after fees</span><b class="${cls(profit)}">${fmt(profit)}</b></div>
   <div class="k"><span class="mu">Return on cost</span><b class="${cls(profit)}">${cost?pc(profit/cost):'–'}</b></div>
   <div class="k"><span class="mu">Unsold stock</span><b>${fmt(stock)}</b></div></div>
   <div class="mu" style="margin-top:6px">${tx.length} transactions saved. ${ac?ac.orders.length+' open orders.':''} Fees are estimated from the rates above.</div>`;
  h+='<h2>What to do better</h2>'+tips(traded,list,n,cost);
  h+='<h2>Profit by item</h2><div class="wrap"><table><tr><th>Item</th><th>Sold</th><th>Margin</th><th>Profit</th></tr>'
   +traded.slice(0,40).map(i=>`<tr><td>${nm(i.id)}</td><td>${fmt(i.q)}</td><td class="${cls(i.margin)}">${pc(i.margin)}</td><td class="${cls(i.profit)}">${fmt(i.profit)}</td></tr>`).join('')
   +'</table></div>';
  const st=list.filter(i=>i.stock>0).sort((x,y)=>y.stock-x.stock).slice(0,15);
  if(st.length)h+='<h2>Unsold stock</h2><div class="wrap"><table><tr><th>Item</th><th>Cost tied up</th><th>Oldest buy</th></tr>'
   +st.map(i=>`<tr><td>${nm(i.id)}</td><td>${fmt(i.stock)}</td><td>${i.oldest.slice(0,10)}</td></tr>`).join('')+'</table></div>';
  h+='<div id="opp"></div>';
  $('#app').innerHTML=h;
  if(LS('opp'))showOpp();
}
function tips(traded,list,n,cost){
  const nm=i=>esc(n[i]||'Item '+i),out=[];
  const T=(t,k)=>out.push(`<div class="tip ${k||''}">${t}</div>`);
  traded.filter(i=>i.profit<0).slice(-3).reverse().forEach(i=>T(`<b>${nm(i.id)}</b> lost ${fmt(-i.profit)} ISK. You sold below your buy price plus fees. Raise your sell price or stop buying it.`,'bad'));
  const thin=traded.filter(i=>i.profit>=0&&i.margin<0.05&&i.vol>5e6).slice(0,3);
  thin.forEach(i=>T(`<b>${nm(i.id)}</b> only returns ${pc(i.margin)} after fees. Small price moves wipe that out.`));
  if(traded[0]&&traded[0].profit>0)T(`Best earner: <b>${nm(traded[0].id)}</b> with ${fmt(traded[0].profit)} ISK profit at ${pc(traded[0].margin)}. Put more ISK here.`,'good');
  const old=list.filter(i=>i.oldest&&Date.now()-new Date(i.oldest)>7*864e5&&i.stock>1e6);
  if(old.length)T(`${old.length} item(s) have sat unsold for over 7 days (${fmt(old.reduce((s,i)=>s+i.stock,0))} ISK). Reprice or sell them to free up your ISK.`,'bad');
  if(!out.length)T('Sync your wallet to get advice. Tips need some completed buy and sell pairs.');
  return out.join('');
}

/* ---------- market scan ---------- */
async function scan(){
  const {list}=analyze();
  const top=list.filter(i=>i.vol>0).sort((x,y)=>y.vol-x.vol).slice(0,8);
  if(!top.length){say('Sync your wallet first.');return}
  const res=[];
  for(const it of top){
    say(`Scanning ${(LS('names')||{})[it.id]||it.id}…`);
    const row={id:it.id,reg:{}};
    await Promise.all(REGIONS.map(async([nm,rid])=>{
      try{
        const o=await api(`/markets/${rid}/orders/?order_type=all&type_id=${it.id}`,false);
        const s=o.filter(x=>!x.is_buy_order).map(x=>x.price),b=o.filter(x=>x.is_buy_order).map(x=>x.price);
        row.reg[nm]={sell:s.length?Math.min(...s):null,buy:b.length?Math.max(...b):null};
      }catch(e){}
    }));
    res.push(row);
  }
  LS('opp',{res,at:Date.now()});say('');showOpp();
}
function showOpp(){
  const o=LS('opp');if(!o||!$('#opp'))return;
  const {tax,brk}=cfg();const n=LS('names')||{};
  const rows=o.res.map(r=>{
    const e=Object.entries(r.reg).filter(([,v])=>v.sell);
    if(e.length<1)return null;
    const lo=e.reduce((a,b)=>b[1].sell<a[1].sell?b:a),hi=e.reduce((a,b)=>b[1].sell>a[1].sell?b:a);
    const haul=lo[1].sell?(hi[1].sell*(1-tax-brk)-lo[1].sell)/lo[1].sell:0;
    const j=r.reg.Jita||{};const spread=j.sell&&j.buy?(j.sell*(1-tax-brk)-j.buy*(1+brk))/(j.buy*(1+brk)):null;
    return {name:esc(n[r.id]||r.id),lo,hi,haul,spread};
  }).filter(Boolean).sort((a,b)=>b.haul-a.haul);
  $('#opp').innerHTML=`<h2>Market chances for your top items</h2>
   <div class="mu">Best prices region-wide. Haul = buy in the cheapest hub, sell in the dearest. Jita flip = buy order vs sell order in Jita. Checked ${new Date(o.at).toLocaleTimeString()}.</div>
   <div class="wrap"><table><tr><th>Item</th><th>Buy at</th><th>Sell at</th><th>Haul</th><th>Jita flip</th></tr>`
   +rows.map(r=>`<tr><td>${r.name}</td><td>${r.lo[0]} ${fmt(r.lo[1].sell)}</td><td>${r.hi[0]} ${fmt(r.hi[1].sell)}</td><td class="${cls(r.haul)}">${pc(r.haul)}</td><td class="${r.spread==null?'':cls(r.spread)}">${r.spread==null?'–':pc(r.spread)}</td></tr>`).join('')
   +'</table></div>';
}

/* ---------- start ---------- */
const wrap=f=>async()=>{try{await f()}catch(e){say(e.message)}};
$('#bLogin').onclick=wrap(login);
$('#bSync').onclick=wrap(sync);
$('#bScan').onclick=wrap(scan);
$('#bOut').onclick=()=>{localStorage.removeItem('auth');render()};
['tax','brk'].forEach(id=>$('#'+id).onchange=()=>{LS('cfg',{tax:+$('#tax').value,brk:+$('#brk').value});render()});
(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('code')){
    try{
      if(p.get('state')!==localStorage.getItem('pk_s'))throw new Error('Login check failed. Try again.');
      await token({grant_type:'authorization_code',code:p.get('code'),code_verifier:localStorage.getItem('pk_v')});
      history.replaceState(null,'',CB);
      render();await wrap(sync)();return;
    }catch(e){say(e.message);history.replaceState(null,'',CB)}
  }
  render();
  if(LS('auth')&&!LS('tx'))wrap(sync)();
})();
</script>
</body>
</html>
