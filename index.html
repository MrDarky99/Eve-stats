<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eve Stats</title>
<style>
:root{--bg:#10141a;--cd:#181e27;--ln:#2a3340;--tx:#e8e4da;--mu:#8f98a6;--isk:#e0a43a;--up:#4fc3a1;--dn:#e8725c}
*{box-sizing:border-box}body{margin:0 auto;max-width:900px;padding:14px;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 8px}.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
button,select{background:var(--isk);color:#1a1405;border:0;border-radius:6px;padding:9px 12px;font:600 14px system-ui}
button.a,select{background:transparent;color:var(--tx);border:1px solid var(--ln)}button.on{background:var(--tx);color:#10141a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--isk);outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.k{background:var(--cd);border-left:3px solid var(--ln);padding:9px 12px;border-radius:4px}.k b{display:block;font-size:19px}
.up{color:var(--up)}.dn{color:var(--dn)}.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu)}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg)}
input{width:68px;background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:6px}#msg{min-height:20px;color:var(--isk)}
@media(min-width:600px){.g{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<h1>Eve Stats</h1><div class="mu">All your characters, one view. Data stays in this browser.</div>
<div class="bar"><button id="bL">Add character</button><button id="bS" class="a">Sync all</button><select id="sc"></select><button id="bX" class="a">Remove</button></div>
<div class="bar" id="tabs"></div><div id="msg"></div>
<div class="mu" id="set">Sales tax % <input id="tax" type="number" step="0.01"> Broker % <input id="brk" type="number" step="0.01"></div>
<div id="app"></div>
<script>
const CID='157277a447ea4912ae61662d2872bc81',CB='https://mrdarky99.github.io/Eve-stats/',ESI='https://esi.evetech.net/latest';
const SC='esi-wallet.read_character_wallet.v1 esi-markets.read_character_orders.v1 esi-assets.read_assets.v1 esi-location.read_location.v1 esi-location.read_ship_type.v1 esi-industry.read_character_jobs.v1 esi-industry.read_character_mining.v1 esi-killmails.read_killmails.v1 esi-planets.manage_planets.v1 esi-universe.read_structures.v1';
const RG=[['Jita',10000002],['Amarr',10000043],['Dodixie',10000032],['Rens',10000030],['Hek',10000042]];
const TABS=[['ov','Overview'],['in','Income'],['tr','Trading'],['ho','Holdings'],['ind','Industry'],['mk','Markets']];
const EX=/sleeper|talocan|ancient|ghost|overseer|intact|malfunctioning|wrecked|neural|jovian|sisters/i;
const RAT=['bounty_prizes','ess_escrow_transfer'],MIS=['agent_mission_reward','agent_mission_time_bonus_reward'];
const $=s=>document.querySelector(s),DAY=864e5;
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const f=n=>Math.round(n).toLocaleString('en-US'),pc=n=>(n*100).toFixed(1)+'%',c=n=>n>=0?'up':'dn';
const esc=s=>String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const say=t=>$('#msg').textContent=t||'';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let sel='all',tab='ov';
const CH=()=>LS('ch')||{},ids=()=>Object.keys(CH()).map(Number),cur=()=>sel==='all'?ids():[+sel],D=i=>LS('d'+i)||{};
const NM=i=>esc((LS('nm')||{})[i]||'#'+i);
const cfg=()=>{const x=LS('cfg')||{t:4.5,b:3};return{t:x.t/100,b:x.b/100,rt:x.t,rb:x.b}};
const tb=(h,r)=>'<div class="w"><table><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+r.map(x=>'<tr>'+x.map(y=>`<td>${y}</td>`).join('')+'</tr>').join('')+'</table></div>';
const card=(l,v,k)=>`<div class="k"><span class="mu">${l}</span><b class="${k||''}">${v}</b></div>`;

async function login(){
 const v=b64(crypto.getRandomValues(new Uint8Array(32))),s=b64(crypto.getRandomValues(new Uint8Array(16)));
 const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 localStorage.setItem('pv',v);localStorage.setItem('ps',s);
 location.href='https://login.eveonline.com/v2/oauth/authorize/?'+new URLSearchParams({response_type:'code',redirect_uri:CB,client_id:CID,scope:SC,code_challenge:ch,code_challenge_method:'S256',state:s});
}
async function tok(body){
 const r=await fetch('https://login.eveonline.com/v2/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...body})});
 if(!r.ok)throw new Error('Login failed: '+await r.text());
 const j=await r.json(),p=JSON.parse(atob(j.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))),id=+p.sub.split(':')[2];
 const C=CH();C[id]={name:p.name,access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-30)*1000};LS('ch',C);return id;
}
async function auth(id){let a=CH()[id];if(Date.now()>a.exp){await tok({grant_type:'refresh_token',refresh_token:a.refresh});a=CH()[id]}return a.access}
async function api(p,id,au=1){const r=await fetch(ESI+p,au?{headers:{Authorization:'Bearer '+await auth(id)}}:{});if(!r.ok)throw new Error('ESI '+r.status+' '+p.split('?')[0]);return r.json()}
async function pages(p,id){let o=[],n=1,m=1;do{const r=await fetch(ESI+p+(p.includes('?')?'&':'?')+'page='+n,{headers:{Authorization:'Bearer '+await auth(id)}});
 if(!r.ok)throw new Error('ESI '+r.status+' '+p.split('?')[0]);m=+r.headers.get('X-Pages')||1;o=o.concat(await r.json());n++}while(n<=m&&n<=12);return o}

async function sync(id){
 const d=D(id),A=p=>api(p,id),T=(p,x)=>A(p).catch(()=>x);say('Syncing '+CH()[id].name+'…');
 const px={};(await api('/markets/prices/',0,0)).forEach(x=>px[x.type_id]=x.average_price||x.adjusted_price||0);
 const tx=d.tx||{};let from=null;
 for(let i=0;i<8;i++){const r=await A(`/characters/${id}/wallet/transactions/`+(from?`?from_id=${from}`:''));if(!r.length)break;
  r.forEach(t=>tx[t.transaction_id]=[Date.parse(t.date),t.type_id,t.quantity,t.unit_price,+t.is_buy,t.location_id]);
  const m=Math.min(...r.map(t=>t.transaction_id));if(r.length<2500||m===from)break;from=m}
 const jr=d.jr||{};(await pages(`/characters/${id}/wallet/journal/`,id)).forEach(j=>jr[j.id]=[Date.parse(j.date),j.ref_type,j.amount]);
 let av=0;const as=(await pages(`/characters/${id}/assets/`,id).catch(()=>[])).map(a=>{const v=(px[a.type_id]||0)*a.quantity;av+=v;return[a.type_id,a.quantity,a.location_id,+a.is_singleton,v]}).sort((a,b)=>b[4]-a[4]).slice(0,300);
 const ord=(await T(`/characters/${id}/orders/`,[])).map(o=>[o.type_id,o.price,o.volume_remain,+!!o.is_buy_order,o.location_id,o.escrow||0]);
 const bal=await A(`/characters/${id}/wallet/`),loc=await T(`/characters/${id}/location/`,{}),sh=await T(`/characters/${id}/ship/`,{});
 const jobs=(await T(`/characters/${id}/industry/jobs/?include_completed=true`,[])).map(j=>[j.activity_id,j.status,j.cost||0,j.runs,j.product_type_id||j.blueprint_type_id,Date.parse(j.end_date)]);
 const mn=(await pages(`/characters/${id}/mining/`,id).catch(()=>[])).map(m=>[Date.parse(m.date),m.quantity,m.solar_system_id,m.type_id,m.quantity*(px[m.type_id]||0)]);
 const pl=await T(`/characters/${id}/planets/`,[]);
 const kl=[];await Promise.all((await T(`/characters/${id}/killmails/recent/`,[])).slice(0,20).map(async k=>{try{const r=await api(`/killmails/${k.killmail_id}/${k.killmail_hash}/`,0,0);
  if(r.victim.character_id===id)kl.push([Date.parse(r.killmail_time),r.victim.ship_type_id,px[r.victim.ship_type_id]||0])}catch(e){}}));
 const sv=ord.filter(o=>!o[3]).reduce((s,o)=>s+o[1]*o[2],0),es=ord.reduce((s,o)=>s+o[5],0),h=d.nw||[];
 if(h.length&&new Date(h.at(-1)[0]).toDateString()===new Date().toDateString())h.pop();h.push([Date.now(),bal+av+sv+es]);
 LS('d'+id,{tx,jr,as,av,ord,bal,loc,sh,jobs,mn,pl:pl.length,kl,nw:h,px:{}});
 const want=new Set([...Object.values(tx).map(t=>t[1]),...as.map(a=>a[0]),...ord.map(o=>o[0]),...jobs.map(j=>j[4]),...mn.flatMap(m=>[m[2],m[3]]),...kl.map(k=>k[1]),sh.ship_type_id,loc.solar_system_id]);
 const L=[...as.slice(0,40).map(a=>a[2]),...ord.map(o=>o[4]),...Object.values(tx).map(t=>t[5]),loc.station_id,loc.structure_id];
 L.forEach(l=>l&&want.add(l));const n=LS('nm')||{};
 const need=[...want].filter(i=>i&&!n[i]&&i<1e8);
 for(let i=0;i<need.length;i+=500)try{const r=await fetch(ESI+'/universe/names/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(need.slice(i,i+500))});if(r.ok)(await r.json()).forEach(x=>n[x.id]=x.name)}catch(e){}
 for(const l of [...new Set(L)].filter(l=>l>1e12&&!n[l]).slice(0,12))try{n[l]=(await A('/universe/structures/'+l+'/')).name}catch(e){}
 LS('nm',n);
}
async function syncAll(){for(const i of ids())await sync(i);say('');draw()}

const win=(a,s,e)=>a.filter(x=>x[0]>Date.now()-e*DAY&&x[0]<=Date.now()-s*DAY);
const sum=(a,t)=>a.filter(x=>t.includes(x[1])).reduce((s,x)=>s+x[2],0);
const J=()=>cur().flatMap(i=>Object.values(D(i).jr||{})),TX=()=>cur().flatMap(i=>Object.values(D(i).tx||{})),Dm=k=>cur().flatMap(i=>D(i)[k]||[]);
const ex=t=>EX.test((LS('nm')||{})[t[1]]||'');
const hrs=(a,t)=>new Set(a.filter(x=>t.includes(x[1])).map(x=>Math.floor(x[0]/36e5))).size;
function fifo(){
 const {t,b}=cfg(),m={};
 for(const x of TX().sort((p,q)=>p[0]-q[0])){const it=m[x[1]]??={id:x[1],L:[],q:0,rev:0,cost:0,vol:0};it.vol+=x[2]*x[3];
  if(x[4])it.L.push({q:x[2],p:x[3],d:x[0]});else{let n=x[2];while(n>0&&it.L.length){const l=it.L[0],u=Math.min(n,l.q);it.q+=u;it.cost+=u*l.p;it.rev+=u*x[3];l.q-=u;n-=u;if(!l.q)it.L.shift()}}}
 return Object.values(m).map(i=>{i.profit=i.rev*(1-t-b)-i.cost*(1+b);i.mg=i.cost?i.profit/i.cost:0;i.stock=i.L.reduce((s,l)=>s+l.q*l.p,0);i.old=i.L[0]?.d;return i});
}
function nwSeries(){
 const ds=cur().map(i=>D(i).nw||[]),days=[...new Set(ds.flat().map(p=>new Date(p[0]).toDateString()))].map(s=>new Date(s).getTime()).sort((a,b)=>a-b);
 return days.map(t=>ds.reduce((s,h)=>{const p=h.filter(x=>x[0]<=t+DAY).at(-1);return s+(p?p[1]:0)},0));
}
function spark(v){if(v.length<2)return'<div class="mu">Net worth chart appears after two days of syncs.</div>';
 const lo=Math.min(...v),hi=Math.max(...v),pt=v.map((y,i)=>`${i/(v.length-1)*300},${50-(y-lo)/((hi-lo)||1)*46}`).join(' ');
 return`<svg viewBox="0 0 300 52" width="100%" height="70"><polyline points="${pt}" fill="none" stroke="#e0a43a" stroke-width="2"/></svg>`}

const V={
ov(){const ds=cur().map(D),S=k=>ds.reduce((s,d)=>s+(d[k]||0),0);
 const so=ds.reduce((s,d)=>s+(d.ord||[]).filter(o=>!o[3]).reduce((a,o)=>a+o[1]*o[2],0),0),es=ds.reduce((s,d)=>s+(d.ord||[]).reduce((a,o)=>a+o[5],0),0);
 const nw=S('bal')+S('av')+so+es,j=win(J(),0,30),inc=j.filter(x=>x[2]>0&&!['market_transaction','player_trading','market_escrow'].includes(x[1])).reduce((s,x)=>s+x[2],0);
 const series=nwSeries(),d7=series.length>7?nw-series.at(-8):null;
 return`<div class="g">${card('Net worth',f(nw))}${card('Wallet',f(S('bal')))}${card('Assets (est.)',f(S('av')))}${card('Sell orders + escrow',f(so+es))}
 ${card('Income 30d (non-market)',f(inc))}${card('Change vs 7d ago',d7==null?'–':f(d7),d7==null?'':c(d7))}</div>${spark(series)}
 <h2>Characters</h2>`+tb(['Pilot','Net worth','Where','Ship'],cur().map(i=>{const d=D(i);return[esc(CH()[i].name),f((d.bal||0)+(d.av||0)),d.loc&&(d.loc.station_id||d.loc.structure_id||d.loc.solar_system_id)?NM(d.loc.station_id||d.loc.structure_id||d.loc.solar_system_id):'–',d.sh&&d.sh.ship_type_id?NM(d.sh.ship_type_id):'–']}))},
in(){const J_=J(),T_=TX(),sells=T_.filter(x=>!x[4]);
 const row=(n,fn)=>{const a=fn(0,7),b=fn(7,14),m=fn(0,30);return[n,f(a),f(b),f(m)]};
 const ms=(s,e)=>win(sells,s,e),jr=(s,e)=>win(J_,s,e),mn=(s,e)=>win(Dm('mn'),s,e).reduce((q,x)=>q+x[4],0);
 const exs=(s,e)=>ms(s,e).filter(ex).reduce((q,x)=>q+x[2]*x[3],0),all=(s,e)=>ms(s,e).reduce((q,x)=>q+x[2]*x[3],0);
 const R=jr(0,30),hr=t=>{const h=hrs(R,t);return h?f(sum(R,t)/h)+'/h':'–'};
 const rows=[row('Ratting',(s,e)=>sum(jr(s,e),RAT)).concat(hr(RAT)),row('Missions',(s,e)=>sum(jr(s,e),MIS)).concat(hr(MIS)),
  row('Exploration loot sold',exs).concat('–'),row('Mining (ore value)',mn).concat('–'),row('Market sales (other)',(s,e)=>all(s,e)-exs(s,e)).concat('–')];
 const exp=(n,t)=>row(n,(s,e)=>-sum(jr(s,e),t)).concat('');
 return'<div class="mu">ISK/h counts only hours with payouts. Exploration is detected by item name. Mining is ore value at average price.</div>'+tb(['Source','7d','Prev 7d','30d','ISK/h'],rows)
 +'<h2>Costs</h2>'+tb(['Cost','7d','Prev 7d','30d',''],[exp('Broker fees',['brokers_fee']),exp('Sales tax',['transaction_tax']),exp('Industry job tax',['industry_job_tax']),exp('PI taxes',['planetary_import_tax','planetary_export_tax'])])},
tr(){const L=fifo(),tr=L.filter(i=>i.q>0).sort((a,b)=>b.profit-a.profit),p=tr.reduce((s,i)=>s+i.profit,0),co=tr.reduce((s,i)=>s+i.cost,0);
 const od=Dm('ord'),sr=win(TX().filter(x=>!x[4]),0,30).reduce((s,x)=>s+x[2]*x[3],0),stock=L.reduce((s,i)=>s+i.stock,0);
 const fee=-sum(win(J(),0,30),['brokers_fee','transaction_tax']);
 return`<div class="g">${card('Profit (est.)',f(p),c(p))}${card('Return on cost',co?pc(p/co):'–',c(p))}${card('Open orders',od.length)}${card('Stock turnover',sr?f(stock/(sr/30))+' days':'–')}</div>
 <div class="mu">Fees paid 30d: ${f(fee)} ISK (${sr?pc(fee/sr):'–'} of sales).</div>`
 +tb(['Item','Sold','Margin','Profit'],tr.slice(0,40).map(i=>[NM(i.id),f(i.q),`<span class="${c(i.mg)}">${pc(i.mg)}</span>`,`<span class="${c(i.profit)}">${f(i.profit)}</span>`]))},
ho(){const as=Dm('as').sort((a,b)=>b[4]-a[4]),loc={};as.forEach(a=>loc[a[2]]=(loc[a[2]]||0)+a[4]);
 return'<h2>By location</h2>'+tb(['Location','Value'],Object.entries(loc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([l,v])=>[NM(l),f(v)]))
 +'<h2>Top items</h2>'+tb(['Item','Qty','Where','Value'],as.slice(0,25).map(a=>[NM(a[0]),f(a[1]),NM(a[2]),f(a[4])]))
 +'<h2>Assembled (ships, modules)</h2>'+tb(['Item','Where','Value'],as.filter(a=>a[3]).slice(0,15).map(a=>[NM(a[0]),NM(a[2]),f(a[4])]))},
ind(){const jb=Dm('jobs'),m=win(jb.filter(j=>j[0]==1),0,30),act=jb.filter(j=>j[1]=='active').sort((a,b)=>a[5]-b[5]),px={};
 const ks=Dm('kl'),mn=Dm('mn'),ore={};mn.forEach(x=>ore[x[3]]=(ore[x[3]]||0)+x[4]);
 return`<div class="g">${card('Builds 30d',m.length)}${card('Job costs 30d',f(m.reduce((s,j)=>s+j[2],0)))}${card('PI planets',cur().reduce((s,i)=>s+(D(i).pl||0),0))}${card('Ships lost',ks.length)}</div>
 <div class="mu">Build output value needs blueprint data, so only job cost shows here. Loss value is the ship’s average market price.</div>
 <h2>Running jobs</h2>`+tb(['Product','Runs','Ends'],act.slice(0,15).map(j=>[NM(j[4]),j[3],new Date(j[5]).toLocaleString()]))
 +'<h2>Mining by ore</h2>'+tb(['Ore','Value'],Object.entries(ore).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,v])=>[NM(t),f(v)]))
 +'<h2>Recent losses</h2>'+tb(['Ship','Date','Value'],ks.sort((a,b)=>b[0]-a[0]).slice(0,10).map(k=>[NM(k[1]),new Date(k[0]).toLocaleDateString(),f(k[2])]))},
mk(){return'<div class="bar"><button id="bM">Scan my top 8 items</button></div><div id="opp"></div>'}};

async function scan(){
 const {t,b}=cfg(),top=fifo().sort((a,b)=>b.vol-a.vol).slice(0,8),rows=[];
 for(const it of top){say('Scanning '+NM(it.id)+'…');const r={};
  await Promise.all(RG.map(async([n,id])=>{try{const o=await api(`/markets/${id}/orders/?order_type=all&type_id=${it.id}`,0,0),s=o.filter(x=>!x.is_buy_order).map(x=>x.price),bu=o.filter(x=>x.is_buy_order).map(x=>x.price);r[n]={s:s.length?Math.min(...s):0,b:bu.length?Math.max(...bu):0}}catch(e){}}));
  const e=Object.entries(r).filter(([,v])=>v.s);if(!e.length)continue;
  const lo=e.reduce((x,y)=>y[1].s<x[1].s?y:x),hi=e.reduce((x,y)=>y[1].s>x[1].s?y:x),j=r.Jita||{};
  const hl=(hi[1].s*(1-t-b)-lo[1].s)/lo[1].s,fl=j.s&&j.b?(j.s*(1-t-b)-j.b*(1+b))/(j.b*(1+b)):null;
  rows.push([NM(it.id),lo[0]+' '+f(lo[1].s),hi[0]+' '+f(hi[1].s),`<span class="${c(hl)}">${pc(hl)}</span>`,fl==null?'–':`<span class="${c(fl)}">${pc(fl)}</span>`])}
 say('');$('#opp').innerHTML='<div class="mu">Haul = buy cheapest hub, sell dearest. Flip = Jita buy order vs sell order.</div>'+tb(['Item','Buy at','Sell at','Haul','Jita flip'],rows);
}
function draw(){
 const C=CH(),I=ids();$('#sc').innerHTML='<option value="all">All characters</option>'+I.map(i=>`<option value="${i}">${esc(C[i].name)}</option>`).join('');$('#sc').value=sel;
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':'a'}" data-t="${k}">${l}</button>`).join('');
 const x=cfg();$('#tax').value=x.rt;$('#brk').value=x.rb;
 $('#app').innerHTML=I.length?V[tab]():'<div class="k">Tap Add character to log in with EVE.</div>';
 if($('#bM'))$('#bM').onclick=w(scan);
}
const w=fn=>async()=>{try{await fn()}catch(e){say(e.message)}};
$('#bL').onclick=w(login);$('#bS').onclick=w(syncAll);
$('#sc').onchange=e=>{sel=e.target.value;draw()};
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
$('#bX').onclick=()=>{if(sel!='all'&&confirm('Remove this character and its saved data?')){const C=CH();delete C[sel];LS('ch',C);localStorage.removeItem('d'+sel);sel='all';draw()}};
['tax','brk'].forEach(i=>$('#'+i).onchange=()=>{LS('cfg',{t:+$('#tax').value,b:+$('#brk').value});draw()});
(async()=>{const p=new URLSearchParams(location.search);draw();
 if(p.get('code')){try{if(p.get('state')!==localStorage.getItem('ps'))throw new Error('Login check failed. Try again.');
  const id=await tok({grant_type:'authorization_code',code:p.get('code'),code_verifier:localStorage.getItem('pv')});history.replaceState(null,'',CB);sel=String(id);draw();await sync(id);say('');draw();return}
  catch(e){say(e.message);history.replaceState(null,'',CB)}}})();
</script></body></html>
